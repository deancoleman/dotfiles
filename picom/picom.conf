
## Shadows ##

shadow = false;
shadow-radius = 10;
shadow-offset-x = -7;
shadow-offset-y = -7;

## Fading ##

fading = false;
fade-in-step = 0.028;
fade-out-step = 0.03;
fade-delta = 10;
frame-opacity = 0.99;

corner-radius = 1

## Blur ##

blur-method = "none"
blur-kern = "3x3box";

backend = "xrender"

dithered-present = false; #not supported by xrender backend
frame-opacity = 0.99;
vsync = true;

detect-rounded-corners = true;

detect-client-opacity = true;

detect-transient = true;

use-damage = true;

rules: ({
  match = "window_type = 'tooltip'";
  fade = true;
  shadow = true;
  opacity = 1.0;
  full-shadow = true;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = true;
})


